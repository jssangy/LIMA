# sweep_1st.yaml
project: MAPF
name: MAPF_SWEEP
program: train.py
method: grid
metric:
  name: avgR
  goal: maximize

parameters:
  lr:
    values: [1e-5, 5e-5, 1e-4, 5e-4, 1e-3]
  clip:
    values: [0.10, 0.20, 0.30]
  entropy_coef:
    values: [0.01, 0.02, 0.03]
  epochs:
    values: [2, 4, 6, 8]
  minibatch:
    values: [64, 128, 256, 512]
  steps_per_update:
    values: [64, 128, 256, 512]

command:
  - ${env}
  - python
  - ${program}
  - --prob_path
  - problems/cross/cross_1.json
  - --updates
  - "300"
  - ${args}         # ★ 하이퍼 전부 자동 주입 (--lr ... --clip ... 등)
  - --device
  - cuda
