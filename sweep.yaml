# sweep_1st.yaml
program: train.py
method: bayes
metric:
  name: avgR
  goal: maximize

parameters:
  lr:
    values: [1e-5, 3e-5, 1e-4, 3e-4, 5e-4]
  clip:
    values: [0.10, 0.15, 0.20, 0.25, 0.30]
  entropy_coef:
    values: [0.005, 0.01, 0.02, 0.03, 0.05]
  epochs:
    values: [2, 3, 4, 6]
  minibatch:
    values: [64, 128, 256]
  events_per_update:
    values: [64, 128, 256, 512]

command:
  - ${env}
  - python
  - ${program}
  - --prob_path
  - problems/cross/cross_1.json
  - --updates
  - "300"
  - ${args}         # ★ 하이퍼 전부 자동 주입 (--lr ... --clip ... 등)
  - --device
  - cuda
