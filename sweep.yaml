# sweep_1st.yaml
program: train.py
method: grid
metric:
  name: avgR          # trainer에서 wandb.log({"avgR": ...}) 하세요
  goal: maximize

parameters:
  lr:                 # Adam 학습률
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-4

  clip:               # PPO clip epsilon
    values: [0.10, 0.15, 0.20, 0.25, 0.30]

  entropy_coef:       # 엔트로피 보너스 계수
    distribution: log_uniform_values
    min: 0.005
    max: 0.05

  epochs:             # PPO epochs per update
    values: [2, 3, 4, 6]

  minibatch:          # 미니배치 크기
    values: [64, 128, 256]

  events_per_update:  # 이벤트 전이 개수
    values: [64, 128, 256, 512]

command:
  - ${env}
  - python
  - ${program}
  - --prob_path
  - problems/cross/cross_1.json
  - --updates
  - "300"
  - --events_per_update
  - ${events_per_update}
  - --epochs
  - ${epochs}
  - --minibatch
  - ${minibatch}
  - --clip
  - ${clip}
  - --lr
  - ${lr}
  - --entropy_coef
  - ${entropy_coef}
  - --device
  - "cuda"
