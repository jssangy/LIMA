# sweep.yaml
project: MAPPO
name: ppo_mappo_sweep
method: grid
metric:
  name: reward       # train.py에서 wandb.log({"reward": ...}) 로 기록 중
  goal: maximize

parameters:
  lr:
    values: [1e-4, 5e-4, 1e-3]
  gamma:
    values: [0.95, 0.99]
  lmbda:
    values: [0.90, 0.95]
  clip_epsilon:
    values: [0.1, 0.2]
  entropy_coeff:
    values: [0.001, 0.005, 0.01]

command:
  - ${env}
  - ${interpreter}
  - train.py
  - -p
  - problems/cross/cross_1.json
  - --total_frames
  - "1000000"
  - --frames_per_batch
  - "1024"
  - --mini_batch_size
  - "64"
  - --num_epochs
  - "10"
  - --seed
  - "7"
  - ${args}
  - --save_dir
  - "artifacts"